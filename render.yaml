services:
  - type: web
    name: jiedian-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_NAME
        value: ??
      - key: ADMIN_PASSWORD_HASH
        sync: false

