<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>接点 · 管理后台</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#f6f6f2;--paper:#fff;--ink:#171916;--muted:#777a73;--line:#e9e9e3;--lime:#d7fa5c;--green:#248257}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans','Noto Sans SC',sans-serif}.wrap{max-width:1120px;margin:auto;padding:0 28px}.top{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-size:18px;font-weight:800;text-decoration:none;color:var(--ink)}.brand b{background:var(--lime);border-radius:8px;padding:6px 8px;margin-right:8px}.top a{color:inherit}.hero{padding:46px 0 26px;display:flex;justify-content:space-between;align-items:end}.eyebrow{font:10px 'DM Mono';color:#777;letter-spacing:1px}.hero h1{font-size:32px;letter-spacing:-1px;margin:8px 0}.muted{font-size:12px;color:var(--muted);margin:0}.btn{border:0;border-radius:8px;background:var(--ink);color:white;padding:11px 16px;font-weight:700;font-size:11px;cursor:pointer}.btn.light{background:white;color:var(--ink);border:1px solid var(--line)}.panel{background:var(--paper);border:1px solid var(--line);border-radius:13px;margin:15px 0;padding:20px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.panelhead h2{font-size:15px;margin:0}.tag{font:10px 'DM Mono';color:#777;background:#f2f3ee;padding:7px 10px;border-radius:20px}.table{width:100%;border-collapse:collapse;font-size:11px}.table th{text-align:left;color:#868981;font-weight:500;padding:10px;border-bottom:1px solid var(--line)}.table td{padding:11px 10px;border-bottom:1px solid #f1f1ed}.table tr:last-child td{border-bottom:0}.table input{width:100%;max-width:150px;padding:8px;border:1px solid var(--line);border-radius:6px;font:11px 'DM Mono'}.switch{accent-color:#85a832;width:16px;height:16px}.msg{font-size:11px;color:#ad5233;margin:12px 0}.ok{color:var(--green)}.hidden{display:none!important}.loginbox{max-width:390px;margin:90px auto;background:white;border:1px solid var(--line);border-radius:15px;padding:27px}.loginbox h1{font-size:22px;margin:0 0 8px}.loginbox p{font-size:11px;color:var(--muted);line-height:1.7}.loginbox input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;margin:11px 0 13px}.loginbox .btn{width:100%}.notice{background:#fff7e6;border:1px solid #f1dfb8;color:#705928;padding:11px 13px;border-radius:8px;font-size:10px;line-height:1.7;margin-top:13px}.empty{color:#888;font-size:11px;padding:12px}.login-state{min-height:70vh}.foot{padding:22px 0;color:#999;font-size:10px}@media(max-width:680px){.wrap{padding:0 15px}.hero{align-items:flex-start;flex-direction:column;gap:13px}.panel{padding:14px;overflow:auto}.table{min-width:650px}}
</style></head><body><div id="loginView" class="login-state hidden"><div class="loginbox"><a href="/" class="brand"><b>⌁</b>接点</a><h1 style="margin-top:23px">管理员登录</h1><p>使用服务器管理员初始化脚本设置的密码。登录有效期为 12 小时。</p><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="管理员密码" required><button class="btn">安全登录&nbsp; ↗</button></form><div id="loginMsg" class="msg"></div><div id="setupHint" class="notice hidden">尚未设置管理员密码。请在服务器运行 <code>npm run admin:password</code>。</div></div></div><div id="adminView" class="hidden"><header class="wrap top"><a class="brand" href="/"><b>⌁</b>接点 <span style="font-size:10px;color:#999;font-weight:500">管理后台</span></a><button id="logout" class="btn light">退出登录</button></header><main class="wrap"><div class="hero"><div><div class="eyebrow">CONTROL PANEL / 01</div><h1>服务管理</h1><p class="muted">更新目录价格、服务地区与公开状态。</p></div><div id="providerTag" class="tag">检查接码供应商状态…</div></div><div class="notice">接码供应商当前默认未配置。设置好供应商账号后，还需要完成其官方 API 适配器与回调校验，才可开放真实短信服务。请勿把供应商密钥放入浏览器。</div><section class="panel"><div class="panelhead"><h2>服务目录</h2><span class="tag">保存后立即生效</span></div><div id="servicesWrap"></div></section><section class="panel"><div class="panelhead"><h2>最近订单</h2><span class="tag">最多显示 200 条</span></div><div id="ordersWrap" class="empty">当前没有真实订单。</div></section><div class="foot">接点管理控制台 · 管理员操作仅在服务端授权后可用</div></main></div><script src="/admin.js" defer></script></body></html>
